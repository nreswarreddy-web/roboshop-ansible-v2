  - name: copy mongo repo
    copy: 
      src: mongo.repo
      dest: /etc/yum.repos.d/mongo.repo

  - name: install mongo server
    package:
      name: mongodb-org
      state: present

  - name: start and enable mongodb
    service:
     name: mongod
     state: started
     enabled: yes

  - name: allow remote connections
    replace:
     path: /etc/mongod.conf
     regexp: '127.0.0.1'
     replace: '0.0.0.0'

     
  - name: restart the sever
    service:
      name: mongod
      state: restarted