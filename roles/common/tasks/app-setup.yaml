  - name: creating application user 
    user:
      name: roboshop
      create_home: false
      home: /app
      system: true
      shell: /sbin/nologin 
      comment: "roboshop system user"

  - name: remove exite app directory
    file:
     path: /app
     state: absent
  
  - name: remove {{ component }}.zip
    file:
     path: /tmp/{{ component }}.zip
     state: absent
 
  - name: crete app directory
    file: 
     path: /app
     state: directory

  - name: Show component value
    debug:
     msg: "{{ component | lower }}"

  - name: download the files
    get_url:
     url: https://raw.githubusercontent.com/daws-92s/roboshop-documentation/main/artifacts/{{ component | lower }}-v4.zip
    dest: /tmp/{{ component }}.zip

  - name: unzip {{ component }}
    unarchive:
      src: /tmp/{{ component }}.zip
      dest: /app
      remote_src: yes 

  